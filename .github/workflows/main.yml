name: CI Pipeline

on:
  push:
    branches:
      - '**'   # Alle Branches
jobs:
  build-java-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          cd backend
          mvn clean install
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: java-build
          path: |
            backend/target/*.jar
            backend/target/*.war

  build-react-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Build
        run: |
          cd frontend
          npm install
          CI=false npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: react-build
          path: frontend/build